<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCore - Link Extractor Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/vteen-all.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <link rel="stylesheet" href="../assets/css/admin-tools.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="tool-page">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="cyber-panel tool-panel-pro p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">← Dashboard</a>
                </div>
                <div class="text-center mb-4">
                    <div class="tool-panel-icon d-inline-block p-3 mb-2">
                        <i class="fa-solid fa-wand-magic-sparkles fa-2x text-info"></i>
                    </div>
                    <h2 class="fw-black mb-1 tool-heading text-white">CYBER<span class="text-info">EXTRACTOR</span></h2>
                    <p class="text-secondary">Hệ thống lọc & chuẩn hóa link M3U8 / Embed tự động</p>
                </div>

                <div class="position-relative mb-4">
                    <textarea id="inputUrls" class="form-control modern-textarea" rows="7"
                        placeholder="Dán mã nguồn HTML, JSON hoặc danh sách link tại đây..."></textarea>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-8">
                        <button onclick="extractAllLinks()" class="btn btn-info w-100 fw-bold py-3">
                            <i class="fa-solid fa-bolt me-2"></i> Lọc toàn bộ Link Video / M3U8 / Embed
                        </button>
                    </div>
                    <div class="col-md-4">
                        <button onclick="copyAll()" class="btn btn-outline-light w-100 h-100 tool-copy-btn">
                            <i class="fa-solid fa-copy me-2"></i> Copy All
                        </button>
                    </div>
                </div>

                <div id="resultArea" style="max-height: 400px; overflow-y: auto; padding-right: 10px;"></div>
            </div>
        </div>
    </div>
</div>

<script src="../assets/js/vteen-core.js"></script>
<script>
function extractAllLinks() {
    const raw = document.getElementById('inputUrls').value.replace(/\\\//g, '/');
    if (!raw.trim()) {
        return Swal.fire('Lỗi', 'Vui lòng dán dữ liệu nguồn', 'error');
    }
    const links = VTeen.processAndCleanLinks(raw);
    const resArea = document.getElementById('resultArea');
    if (!links.length) {
        resArea.innerHTML = '<div class="text-danger text-center py-3">Không tìm thấy liên kết hợp lệ nào!</div>';
        return;
    }
    resArea.innerHTML = links.map(l => `
        <div class="res-card d-flex justify-content-between align-items-center p-2 mb-2 rounded border border-info border-opacity-25 bg-dark">
            <div class="text-truncate fw-bold text-info me-3">${VTeen.escapeHtml(l)}</div>
            <button onclick="navigator.clipboard.writeText('${VTeen.escapeHtml(l)}')" class="btn btn-sm btn-secondary">Copy</button>
        </div>
    `).join('');
    Swal.fire({
        icon: 'success',
        title: `Đã trích xuất ${links.length} liên kết!`,
        toast: true,
        position: 'top-end',
        timer: 2000,
        showConfirmButton: false,
        background: '#0f172a',
        color: '#fff'
    });
}

function copyAll() {
    const links = Array.from(document.querySelectorAll('#resultArea .text-info')).map(el => el.innerText);
    if (!links.length) return;
    navigator.clipboard.writeText(links.join('\n'));
    Swal.fire({ title: 'COPIED!', icon: 'success', toast: true, position: 'center', showConfirmButton: false, timer: 1000 });
}
</script>
</body>
</html>
