<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050508">
    <title>Dang nhap - VTEEN SECURE</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/vteen-all.css">
    <link rel="stylesheet" href="assets/css/universe-stream.css">
    <style>
        body.login-page {
            min-height: 100vh;
            background:
                radial-gradient(circle at 16% 20%, rgba(0, 242, 255, 0.12), transparent 34%),
                radial-gradient(circle at 84% 12%, rgba(255, 0, 200, 0.1), transparent 30%),
                linear-gradient(135deg, #05070b, #090d14 58%, #05070b);
            overflow-x: hidden;
        }
        body.login-page .container {
            width: min(420px, calc(100% - 32px));
            min-height: calc(100vh - 76px);
            margin: 0 auto;
            display: grid;
            place-items: center;
            padding: 40px 0;
        }
        body.login-page .login-card {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 34px;
            border-radius: 26px;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.025)),
                rgba(6, 10, 16, 0.88);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 28px 90px rgba(0, 0, 0, 0.46);
            backdrop-filter: blur(18px);
        }
        body.login-page .logo-area {
            width: 68px;
            height: 68px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 22px;
            color: #dff9ff;
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid rgba(0, 242, 255, 0.22);
            font-size: 28px;
        }
        body.login-page .login-title {
            margin: 0;
            text-align: center;
            color: #ffffff;
            font-size: 28px;
            font-weight: 950;
        }
        body.login-page .login-title span {
            color: #dff9ff;
        }
        body.login-page .login-desc {
            margin: 9px 0 28px;
            text-align: center;
            color: rgba(255,255,255,0.62);
            font-size: 14px;
        }
        body.login-page .err-msg {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 14px;
            color: #fecaca;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.28);
            font-size: 13px;
            font-weight: 800;
            line-height: 1.5;
        }
        body.login-page .input-group-cyber {
            margin-bottom: 14px;
        }
        body.login-page .input-group-cyber input {
            width: 100%;
            height: 48px;
            padding: 0 15px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1) !important;
            background: rgba(0,0,0,0.34) !important;
            color: #ffffff;
            outline: none;
            font-weight: 700;
        }
        body.login-page .input-group-cyber input:focus {
            border-color: rgba(0, 242, 255, 0.5) !important;
            box-shadow: 0 0 0 3px rgba(0, 242, 255, 0.12) !important;
        }
        body.login-page .login-submit {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 48px;
            margin-top: 6px;
            border: 0;
            border-radius: 14px;
            color: #061018;
            background: linear-gradient(135deg, #dff9ff, #00f2ff);
            font-weight: 950;
            cursor: pointer;
            transition: transform 0.18s ease, filter 0.18s ease;
            box-shadow: 0 16px 34px rgba(0, 242, 255, 0.22);
        }
        body.login-page .login-submit:hover {
            filter: brightness(1.06);
            transform: translateY(-1px);
        }
        body.login-page .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        body.login-page .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(223, 249, 255, 0.55);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.6);
            animation: loginParticleFloat linear infinite;
        }
        @keyframes loginParticleFloat {
            from { transform: translate3d(0, 18px, 0); opacity: 0; }
            20%, 80% { opacity: 0.75; }
            to { transform: translate3d(0, -42px, 0); opacity: 0; }
        }
    </style>
</head>
<body class="universe-stream-page login-page">
<header class="navbar">
    <div class="nav-wrap">
        <a href="index.html" class="logo">
            <div class="logo-main">VTEEN UNIVERSE</div>
            <div class="logo-sub">KHO PHIM TRUC TUYEN</div>
        </a>
        <nav class="menu" id="mainMenu"></nav>
        <button class="mobile-menu-toggle" type="button" aria-label="Mo menu" aria-expanded="false" aria-controls="mainMenu">
            <i class="fa fa-bars"></i>
        </button>
    </div>
</header>

<div class="particles" id="particles"></div>

<div class="container">
    <div class="login-card">
        <div class="logo-area">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 class="login-title">VTEEN <span>SECURE</span></h2>
        <p class="desc login-desc">He thong xac thuc tap trung V2</p>

        <div class="err-msg" id="loginErrBox"></div>

        <form id="loginForm" autocomplete="off">
            <div class="input-group-cyber">
                <input type="text" id="usernameInput" placeholder="Username" required autofocus>
            </div>
            <div class="input-group-cyber">
                <input type="password" id="passwordInput" placeholder="Password" required>
            </div>
            <button type="submit" class="login-submit" id="submitBtn">
                DANG NHAP NGAY
            </button>
        </form>
    </div>
</div>

<footer class="v-footer">
    <div class="v-footer-inner">
        <div class="v-footer-brand">
            <div class="v-footer-logo">
                VTEEN MOVIES
                <span class="v-badge-pro">PRIVATE</span>
            </div>
            <p class="v-footer-desc">
                Kho noi dung giai tri rieng tu, toi uu cho trai nghiem xem tren may tinh va dien thoai.
            </p>
        </div>
        <nav class="v-footer-links">
            <a href="index.html" class="v-footer-link"><i class="fa-solid fa-cloud-arrow-up"></i><span>Cap nhat</span></a>
            <a href="phim.html" class="v-footer-link"><i class="fa-solid fa-film"></i><span>Kho phim</span></a>
            <a href="admin/index.html" class="v-footer-link"><i class="fa-solid fa-user-shield"></i><span>Admin</span></a>
        </nav>
        <div class="v-copyright">&copy; 2026 <b>VTEEN MEDIA GROUP</b>. Van hanh boi <span class="v-neon">VTEEN</span>.</div>
    </div>
</footer>

<script src="assets/js/vteen-core.js"></script>
<script src="assets/js/universe-stream.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('particles');
    if (container) {
        for (let i = 0; i < 40; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.top = Math.random() * 100 + 'vh';
            p.style.animationDuration = (Math.random() * 5 + 5) + 's';
            p.style.animationDelay = Math.random() * 5 + 's';
            container.appendChild(p);
        }
    }

    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('loginErrBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'DANG XAC THUC...';

        const u = document.getElementById('usernameInput').value;
        const p = document.getElementById('passwordInput').value;

        try {
            const res = await VTeen.auth.verifyLogin(u, p, false);
            if (res.ok) {
                const next = new URLSearchParams(window.location.search).get('next');
                window.location.href = next || 'phim.html';
                return;
            }
            errBox.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${VTeen.escapeHtml(res.msg)}`;
            errBox.style.display = 'block';
        } catch (err) {
            errBox.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Loi he thong: ${VTeen.escapeHtml(err.message)}`;
            errBox.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'DANG NHAP NGAY';
        }
    });
});
</script>
</body>
</html>
