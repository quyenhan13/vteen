<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050508">
    <title>VTEEN Tube - Cosmic Glow Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/vteen-all.css">
    <link rel="stylesheet" href="../assets/css/universe-stream.css">
    <style>
        :root {
            --accent: #06b6d4;
            --bg: #09090b;
            --card-bg: #18181b;
            --text: #ffffff;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding-bottom: 150px; }
        .header-area { padding: 40px 20px; display: flex; justify-content: center; }
        .yt-search-box {
            display: flex !important; align-items: center !important; background: #27272a !important;
            border-radius: 999px !important; width: 100% !important; max-width: 500px !important;
            height: 50px !important; border: 1px solid #3f3f46 !important; padding: 0 5px 0 20px !important;
        }
        .yt-search-box input { flex: 1 !important; border: none !important; background: none !important; color: #fff !important; outline: none !important; font-size: 16px !important; padding: 0 10px !important; }
        .yt-search-box button { flex: 0 0 40px !important; width: 40px !important; height: 40px !important; border-radius: 50% !important; border: none !important; background: var(--accent) !important; color: #000 !important; cursor: pointer !important; display: flex !important; align-items: center !important; justify-content: center !important; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; padding: 0 40px; }
        .card {
            background: var(--card-bg); padding: 16px; border-radius: 16px; cursor: pointer;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid #27272a; position: relative; overflow: hidden;
        }
        .card::before {
            content: ''; position: absolute; inset: -50px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.15), transparent 70%);
            opacity: 0; transition: opacity 0.5s; z-index: 0;
        }
        .card:hover { transform: translateY(-8px); border-color: var(--accent); }
        .card:hover::before { opacity: 1; }
        .card img { width: 100%; border-radius: 12px; aspect-ratio: 16/9; object-fit: cover; position: relative; z-index: 1; }
        .card h3 { font-size: 14px; margin: 15px 0 5px; position: relative; z-index: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .player-bar {
            position: fixed; bottom: 20px; left: 20px; right: 20px; height: 80px;
            background: rgba(24, 24, 27, 0.85); backdrop-filter: blur(20px);
            border-radius: 16px; border: 1px solid #3f3f46;
            display: flex; align-items: center; padding: 0 24px; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .controls { flex: 1; display: flex; justify-content: center; gap: 20px; align-items: center; }
        .btn-act { background: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #000; }
        .btn-side { background: none; border: none; color: #fff; cursor: pointer; font-size: 18px; }
        .progress-bar { position: absolute; top: -1px; left: 0; right: 0; height: 3px; background: #333; }
        #p-seek { -webkit-appearance: none; width: 100%; height: 3px; background: transparent; cursor: pointer; }
        #p-seek::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; background: var(--accent); border-radius: 50%; }
    </style>
</head>
<body class="universe-stream-page">
<header class="navbar">
    <div class="nav-wrap">
        <a href="../index.html" class="logo">
            <div class="logo-main">VTEEN UNIVERSE</div>
            <div class="logo-sub">KHO PHIM TRUC TUYEN</div>
        </a>
        <nav class="menu" id="mainMenu"></nav>
        <button class="mobile-menu-toggle" type="button" aria-label="Mo menu" aria-expanded="false" aria-controls="mainMenu">
            <i class="fa fa-bars"></i>
        </button>
    </div>
</header>

<div class="header-area">
    <form id="ytSearchForm" class="yt-search-box">
        <input type="text" id="ytQuery" placeholder="Tìm kiếm bài hát hoặc dán link YouTube..." value="nhạc việt mới nhất">
        <button type="submit"><i class="fa fa-search"></i></button>
    </form>
</div>

<div class="grid-container" id="trackGrid"></div>

<div class="player-bar" id="music-player">
    <div class="progress-bar"><input type="range" id="p-seek" value="0" min="0" max="100" step="0.1"></div>
    <div style="display:flex; align-items:center; gap:12px; width:250px;">
        <img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" id="p-thumb" style="width:45px; height:45px; border-radius:6px; object-fit:cover;">
        <div style="overflow:hidden;">
            <h4 id="p-title" style="margin:0; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Chưa phát</h4>
            <p id="p-channel" style="margin:0; color:#a1a1aa; font-size:11px;">VTEEN</p>
        </div>
    </div>
    <div class="controls">
        <button class="btn-side" id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
        <button class="btn-act" id="play-pause-btn"><i class="fa-solid fa-play"></i></button>
        <button class="btn-side" id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
    </div>
    <div style="width:200px; display:flex; justify-content:flex-end;">
        <input type="range" id="volume-slider" min="0" max="100" value="100" style="width:70px; accent-color:var(--accent);">
    </div>
</div>

<div id="yt-hidden-player" style="position: absolute; top: -9999px; left: -9999px; visibility: hidden;"></div>

<script src="../assets/js/vteen-core.js"></script>
<script src="../assets/js/universe-stream.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player;
let currentTrackIndex = -1;
let defaultVideos = [];
let activeVideos = [];

function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-hidden-player', {
        events: { 'onStateChange': onPlayerStateChange }
    });
}

function onPlayerStateChange(event) {
    const btn = document.getElementById('play-pause-btn');
    if (event.data == YT.PlayerState.PLAYING) btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
    else btn.innerHTML = '<i class="fa-solid fa-play"></i>';
    if (event.data == YT.PlayerState.ENDED) playNext();
}

function renderTracks(list) {
    activeVideos = list;
    const grid = document.getElementById('trackGrid');
    grid.innerHTML = list.map((video, index) => `
        <div class="card music-track" data-index="${index}">
            <img src="${VTeen.escapeHtml(video.thumbnail)}" alt="${VTeen.escapeHtml(video.title)}">
            <h3>${VTeen.escapeHtml(video.title)}</h3>
        </div>
    `).join('');

    grid.querySelectorAll('.music-track').forEach(card => {
        card.addEventListener('click', () => playTrack(parseInt(card.dataset.index, 10)));
    });
}

function playTrack(index) {
    if (!activeVideos.length) return;
    currentTrackIndex = (index + activeVideos.length) % activeVideos.length;
    const track = activeVideos[currentTrackIndex];
    document.getElementById('p-thumb').src = track.thumbnail;
    document.getElementById('p-title').innerText = track.title;
    document.getElementById('p-channel').innerText = track.channelTitle || 'VTEEN';
    if (player && player.loadVideoById) {
        player.loadVideoById(track.id);
        player.playVideo();
    }
}

function togglePlay() {
    if (!player || !player.getPlayerState) return;
    if (player.getPlayerState() == YT.PlayerState.PLAYING) player.pauseVideo();
    else player.playVideo();
}
function playNext() { playTrack(currentTrackIndex + 1); }
function playPrev() { playTrack(currentTrackIndex - 1); }

document.addEventListener('DOMContentLoaded', async () => {
    defaultVideos = await VTeen.db.getYouTubeDefault();
    renderTracks(defaultVideos);

    document.getElementById('play-pause-btn').addEventListener('click', togglePlay);
    document.getElementById('nextBtn').addEventListener('click', playNext);
    document.getElementById('prevBtn').addEventListener('click', playPrev);
    document.getElementById('volume-slider').addEventListener('input', (e) => {
        if (player && player.setVolume) player.setVolume(e.target.value);
    });
    document.getElementById('p-seek').addEventListener('input', (e) => {
        if (player && player.seekTo && player.getDuration) {
            player.seekTo((e.target.value / 100) * player.getDuration(), true);
        }
    });

    document.getElementById('ytSearchForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const q = document.getElementById('ytQuery').value.trim();
        if (!q) {
            renderTracks(defaultVideos);
            return;
        }
        // Check if user pasted a YouTube link or video ID
        const ytIdMatch = q.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/);
        if (ytIdMatch) {
            const vid = ytIdMatch[1];
            try {
                const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${vid}`);
                const meta = await res.json();
                const item = {
                    id: vid,
                    title: meta.title || `YouTube Video ${vid}`,
                    channelTitle: meta.author_name || 'YouTube',
                    thumbnail: `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`
                };
                renderTracks([item, ...defaultVideos]);
                playTrack(0);
                return;
            } catch (err) {}
        }
        const filtered = defaultVideos.filter(v =>
            String(v.title || '').toLowerCase().includes(q.toLowerCase()) ||
            String(v.channelTitle || '').toLowerCase().includes(q.toLowerCase())
        );
        renderTracks(filtered.length ? filtered : defaultVideos);
    });
});
</script>
</body>
</html>
